<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fuel Route Optimizer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1180px;margin:auto;padding:24px}.card{background:white;border-radius:14px;box-shadow:0 8px 28px #17203314;padding:20px}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;margin-bottom:18px}input,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #ccd5e0}button{background:#146c5a;color:white;border:0;font-weight:700;cursor:pointer}#map{height:560px;border-radius:12px}.summary{display:flex;gap:28px;min-height:48px;align-items:center}.error{color:#a22222}@media(max-width:700px){.form{grid-template-columns:1fr}#map{height:480px}}
  </style>
</head>
<body><main class="shell"><h1>Fuel Route Optimizer</h1><section class="card">
  <form id="route-form" class="form"><input id="start" aria-label="Start" placeholder="Start, e.g. Dallas, TX" required><input id="finish" aria-label="Destination" placeholder="Destination, e.g. Miami, FL" required><button>Find Route</button></form>
  <div id="summary" class="summary">Enter two US locations to plan a route.</div><div id="map"></div>
</section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([39,-98],4);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);let layer;
document.querySelector('#route-form').addEventListener('submit',async e=>{e.preventDefault();const summary=document.querySelector('#summary');summary.textContent='Planning route…';try{const response=await fetch('/api/v1/route/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start:document.querySelector('#start').value,finish:document.querySelector('#finish').value})});const data=await response.json();if(!response.ok)throw new Error(data.error?.message||'Request failed');if(layer)layer.remove();layer=L.geoJSON(data.map,{style:f=>f.properties.kind==='route'?{color:'#146c5a',weight:5}:{},pointToLayer:(f,ll)=>L.marker(ll),onEachFeature:(f,l)=>{const p=f.properties;if(p.kind==='fuel_stop')l.bindPopup(`<b>${p.name}</b><br>$${p.price_per_gallon}/gal<br>${p.gallons_purchased} gal · $${p.stop_cost}`);else if(p.label)l.bindPopup(p.label)}}).addTo(map);map.fitBounds(layer.getBounds(),{padding:[20,20]});summary.innerHTML=`<b>${data.route.distance_miles} miles</b><span>${data.fuel_stops.length} fuel stop(s)</span><span>${data.summary.gallons_purchased_en_route} gallons purchased</span><span><b>$${data.summary.total_fuel_cost}</b> total</span>`}catch(error){summary.className='summary error';summary.textContent=error.message}});
</script></body></html>
